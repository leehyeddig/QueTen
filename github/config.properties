# =====================================================================
# GitHub Actions(정적 내보내기) 전용 설정. 이 파일은 공개 저장소에 올라간다.
#  - 토큰·인증키는 절대 여기 적지 말 것. 저장소 Settings > Secrets and variables > Actions 에 넣는다.
#      META_ACCESS_TOKEN        (= meta.access.token)
#      QOO10_CERTIFICATION_KEY  (= qoo10.certification.key)
#  - 톰캣용 설정은 src/main/webapp/WEB-INF/config.properties (git에 올리지 않음).
#    환율·상품코드 등을 바꿀 때는 두 파일을 같이 고친다.
# =====================================================================

# 날짜 경계 기준 타임존 (Qoo10 Japan = JST)
app.zone=Asia/Tokyo

# ---- DB: 작업 폴더의 data/ 에 H2 파일. Actions 캐시로 다음 실행에 넘긴다 ----
# 캐시가 사라지면 빈 DB로 시작해 backfill.days 만큼 자동으로 다시 받는다.
db.driver=org.h2.Driver
db.url=jdbc:h2:file:./data/queten;MODE=MySQL;DATABASE_TO_LOWER=TRUE
db.user=sa
db.schema=schema-h2.sql

# ---- Meta Marketing API ----
meta.api.version=v25.0
meta.ad.account.id=144788078622604
meta.recollect.days=3
meta.backfill.days=1095
meta.chunk.days=90

# ---- Qoo10 QAPI ----
qoo10.overlap.hours=24
qoo10.backfill.days=365
# 광고 중인 상품코드 (쉼표 구분). 비우면 전체 주문을 집계
qoo10.ad.product.codes=1217475431
# 매출 집계에서 뺄 주문상태 값 (쉼표 구분)
qoo10.excluded.statuses=CLAIM_3,CLAIM_6,CLAIM_14,CLAIM_16

# ---- 환율: 1 (광고계정 통화) = ? JPY ----
fx.krw=0.11566
